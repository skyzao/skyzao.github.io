<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo Frutiger (Céu / Água) -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#0072ff"/>
      <stop offset="100%" stop-color="#003399"/>
    </linearGradient>

    <!-- Gradiente do Reflexo de Vidro (Brilho Superior) -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Gradiente Neon para a Maçã Glossy 3D -->
    <linearGradient id="appleGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#a6a6a6"/>
    </linearGradient>

    <!-- Sombra projetada do efeito 3D -->
    <filter id="aeroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base com Vidro Arredondado -->
  <rect width="100" height="100" rx="22" fill="url(#skyGrad)"/>

  <!-- Brilho curvado de vidro no topo (Efeito Aero Gloss) -->
  <path d="M 0 22 Q 0 0 22 0 L 78 0 Q 100 0 100 22 L 100 45 Q 50 65 0 45 Z" fill="url(#glassGloss)" opacity="0.6"/>

  <!-- Bolha de Água / Efeito Frutiger -->
  <circle cx="20" cy="75" r="8" fill="#ffffff" opacity="0.25"/>
  <circle cx="23" cy="73" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="80" cy="30" r="5" fill="#ffffff" opacity="0.2"/>

  <!-- Silhueta da Maçã em Estilo Vidro 3D Glossy -->
  <g filter="url(#aeroShadow)">
    <path fill="url(#appleGlow)" d="M 64.1 48.7 C 64.2 40.7 70.8 36.8 71.1 36.6 C 67.4 31.2 61.6 30.5 59.6 30.4 C 54.8 29.9 50.1 33.3 47.6 33.3 C 45.1 33.3 41.3 30.5 37.3 30.6 C 32.1 30.7 27.2 33.7 24.5 38.4 C 19 48 23.1 62.1 28.4 69.8 C 31 73.5 34.1 77.7 38.1 77.5 C 42 77.3 43.5 75 48.2 75 C 52.8 75 54.2 77.5 58.3 77.4 C 62.5 77.3 65.2 73.6 67.7 69.9 C 70.7 65.6 71.9 61.4 72 61.2 C 71.9 61.1 64 58.1 64.1 48.7 Z M 57.6 24.3 C 59.8 21.6 61.2 17.9 60.8 14 C 57.5 14.1 53.4 16.2 51.1 19 C 49 21.4 47.1 25.2 47.6 29 C 51.3 29.3 55.3 27 57.6 24.3 Z" />
    
    <!-- Reflexo de luz na própria maçã -->
    <path fill="#ffffff" opacity="0.4" d="M 47.6 33.3 C 50.1 33.3 54.8 29.9 59.6 30.4 C 60.5 30.5 62.4 30.7 64.5 31.8 C 58 35 52 42 53 52 C 45 48 38 52 35 45 C 32 38 38 32 47.6 33.3 Z"/>
  </g>
</svg>
