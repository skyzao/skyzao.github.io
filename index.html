<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      cursor: default;
      user-select: none; /* Impede de selecionar texto */
      -webkit-user-select: none;
    }

    body {
      background-color: #1e1e1e;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      overflow-x: hidden;
      min-height: 200vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Rastro RGB Futurista */
    .rgb-particle {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      animation: fadeOut 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      box-shadow: 0 0 12px currentColor;
    }

    @keyframes fadeOut {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.2);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.1);
      }
    }

    /* Primeira Seção */
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      position: relative;
      background: radial-gradient(circle at 50% 30%, #2d2d30 0%, #1e1e1e 70%);
    }

    .hero h1 {
      font-size: 5rem;
      font-weight: 700;
      letter-spacing: -1.5px;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.15));
    }

    .hero p {
      font-size: 1.25rem;
      color: #86868b;
      max-width: 600px;
      line-height: 1.5;
      font-weight: 400;
    }

    .scroll-hint {
      position: absolute;
      bottom: 40px;
      color: #86868b;
      font-size: 0.9rem;
      letter-spacing: 1px;
      animation: bounce 2s infinite;
    }

    /* Segunda Seção */
    .troll-section {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background-color: #161618;
    }

    .macos-card {
      background: rgba(30, 30, 32, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 50px 40px;
      max-width: 650px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .macos-card p {
      font-size: 1.5rem;
      color: #f5f5f7;
      line-height: 1.6;
      font-weight: 500;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-8px); }
      60% { transform: translateY(-4px); }
    }

    @media (max-width: 768px) {
      .hero h1 { font-size: 3rem; }
      .macos-card p { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <!-- Topo -->
  <section class="hero">
    <h1>Hello World!</h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
    <div class="scroll-hint">↓ Role para baixo ↓</div>
  </section>

  <!-- Final ao rolar -->
  <section class="troll-section">
    <div class="macos-card">
      <p>Por que voce está aqui? Este site é uma merda digital, ou seja, só vai atualizar quando o dono quiser.</p>
    </div>
  </section>

  <script>
    // Mouse RGB
    let hue = 0;
    document.addEventListener('mousemove', function(e) {
      hue = (hue + 5) % 360;
      
      const particle = document.createElement('div');
      particle.className = 'rgb-particle';
      particle.style.left = e.clientX + 'px';
      particle.style.top = e.clientY + 'px';
      particle.style.color = `hsl(${hue}, 100%, 60%)`;
      particle.style.backgroundColor = `hsl(${hue}, 100%, 60%)`;
      
      document.body.appendChild(particle);

      setTimeout(() => {
        particle.remove();
      }, 600);
    });

    // --- PROTEÇÕES DE BLOQUEIO DE DEVTOOLS / F12 ---

    function xingamento() {
      alert("vai tomar no cu");
    }

    // 1. Bloqueia Botão Direito (Menu de Contexto / Inspecionar)
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      xingamento();
    });

    // 2. Bloqueia Atalhos de Teclado (F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U, Cmd+Option+I, etc)
    document.addEventListener('keydown', function(e) {
      if (
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
        (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's')) ||
        (e.metaKey && e.altKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'U' || e.key === 'u'))
      ) {
        e.preventDefault();
        e.stopPropagation();
        xingamento();
      }
    });

    // 3. MENSAGEM NO CONSOLE / SOURCES (Pra quem conseguir abrir o DevTools)
    console.log("%cTENHA CERTEZA DE QUE VC VAI COLAR ALGO AQUI.", "color: red; font-size: 24px; font-weight: bold; -webkit-text-stroke: 1px black;");
    console.log("%cSe vc vai colar algo aqui, parabens vc e burro para caralho de acreditar em um codigo do Discord que vai te prometer 1000 robux de graça.", "color: yellow; font-size: 16px; font-weight: bold; background: black; padding: 10px; border-radius: 5px;");
  </script>

</body>
</html>
